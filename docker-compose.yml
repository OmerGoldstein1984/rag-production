services:
  # FastAPI Backend
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # optional: copy .env.example to .env and fill in. Secrets are never baked into the image.
      - path: .env
        required: false
    environment:
      - LOG_LEVEL=info
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
    volumes:
      # persistent vector store + embedding cache + uploaded docs
      - ./data:/app/data:rw
      - ./uploads:/app/uploads:rw
      - ./logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      # python-based: curl is not present in the slim image
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Streamlit UI
  ui:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - API_BASE_URL=http://api:8000
    volumes:
      - ./data:/app/data:rw
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Add a reverse proxy (NGINX) for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - api
  #     - ui
  #   restart: unless-stopped

volumes:
  data:
  logs: