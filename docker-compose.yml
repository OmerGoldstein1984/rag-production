version: '3.8'

services:
  # FastAPI Backend
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Streamlit UI
  ui:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - API_BASE_URL=http://api:8000
    volumes:
      - ./data:/app/data:rw
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Add a reverse proxy (NGINX) for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - api
  #     - ui
  #   restart: unless-stopped

volumes:
  data:
  logs: